<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fdf6f4">
<title>ParKuma</title>
<meta name="description" content="All of ParKuma's links in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23e0557f'/%3E%3Ctext x='50' y='68' font-family='Nunito, sans-serif' font-size='52' font-weight='800' fill='%23fff6f8' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html {
    background: #fdf6f4;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background:
      radial-gradient(60% 50% at 12% 8%,  #ffe1ec 0%, transparent 70%),
      radial-gradient(55% 45% at 88% 12%, #e0e9ff 0%, transparent 70%),
      radial-gradient(55% 50% at 8% 92%,  #d8f5e8 0%, transparent 70%),
      radial-gradient(60% 50% at 92% 88%, #fff4c4 0%, transparent 70%),
      #fdf6f4;
    color: #4a3237;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Rainbow title — delete this <h1> if you don't want a heading */
  h1 {
    margin: 0 0 26px;
    text-align: center;
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    font-weight: 800;
    letter-spacing: .5px;
    color: #e0557f;
  }
  @supports ((background-clip: text) or (-webkit-background-clip: text)) {
    h1 {
      background: linear-gradient(95deg, #e0557f, #e08a3c, #3fa87d, #4a7fd4, #8a5bd0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  }

  /* Mobile first: single column */
  nav {
    width: 100%;
    max-width: 340px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  nav a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 14px 20px;
    text-align: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.1rem;
    line-height: 1.2;
    color: var(--t);
    background: var(--c);
    border: 2px solid rgba(255, 255, 255, .75);
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(180, 110, 130, .18);
    transition: filter .15s ease, transform .15s ease;
  }

  nav a:hover  { filter: brightness(.96); }
  nav a:active { transform: scale(.98); }
  nav a:focus-visible { outline: 3px solid var(--t); outline-offset: 3px; }

  /* One colour per button: --c = background, --t = text */
  nav a:nth-child(1) { --c: #ffd6e2; --t: #b02a58; }  /* pink     */
  nav a:nth-child(2) { --c: #ffe0c2; --t: #a44f16; }  /* peach    */
  nav a:nth-child(3) { --c: #fff3ba; --t: #8a6900; }  /* yellow   */
  nav a:nth-child(4) { --c: #c9f2de; --t: #15795a; }  /* mint     */
  nav a:nth-child(5) { --c: #d5e7ff; --t: #1c5aa6; }  /* sky blue */
  nav a:nth-child(6) { --c: #e6dcff; --t: #5b3aa8; }  /* lavender */
  nav a:nth-child(7) { --c: #ffdcd0; --t: #a63a20; }  /* coral    */

  /* Tablet: two columns */
  @media (min-width: 700px) {
    nav {
      max-width: 660px;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    nav a { min-height: 66px; font-size: 1.15rem; }
  }

  /* Laptop / desktop */
  @media (min-width: 1100px) {
    nav { max-width: 820px; gap: 22px; }
    nav a {
      min-height: 78px;
      padding: 18px 26px;
      font-size: 1.3rem;
    }
    h1 { font-size: 3rem; margin-bottom: 34px; }
  }

  /* Large desktop */
  @media (min-width: 1800px) {
    nav { max-width: 1040px; gap: 26px; }
    nav a { min-height: 92px; font-size: 1.5rem; }
    h1 { font-size: 3.8rem; }
  }

  /* Short landscape screens */
  @media (max-height: 520px) and (orientation: landscape) {
    body { align-items: flex-start; padding-block: 20px; }
    nav { max-width: 820px; grid-template-columns: 1fr 1fr; gap: 12px; }
    nav a { min-height: 50px; font-size: 1rem; }
    h1 { font-size: 1.6rem; margin-bottom: 16px; }
  }

  @media (forced-colors: active) {
    nav a { border: 2px solid LinkText; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ParKuma</h1>
  <nav>
    <a href="https://ko-fi.com/parkuma" target="_blank" rel="noopener">Support Me</a>
    <a href="https://www.patreon.com/ParKuma" target="_blank" rel="noopener">Patreon</a>
    <a href="https://www.instagram.com/parkuma_art" target="_blank" rel="noopener">Instagram</a>
    <a href="https://x.com/parkuma_art" target="_blank" rel="noopener">X (Twitter)</a>
    <a href="https://bsky.app/profile/parkuma.bsky.social" target="_blank" rel="noopener">BlueSky</a>
    <a href="https://www.youtube.com/@ParKuma" target="_blank" rel="noopener">YouTube</a>
    <a href="mailto:parkumaofficial@gmail.com">E-Mail</a>
  </nav>
</div>
</body>
</html>
