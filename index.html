<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#202743">
<title>ParKuma</title>
<meta name="description" content="All of ParKuma's links in one place.">
<meta property="og:type" content="website">
<meta property="og:title" content="ParKuma">
<meta property="og:description" content="All of ParKuma's links in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23202743'/%3E%3Ctext x='50' y='68' font-family='Nunito, sans-serif' font-size='52' font-weight='800' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     COLOUR SETTINGS — EVERY COLOUR YOU CAN CHANGE IS RIGHT HERE
     ----------------------------------------------------------------
     Change only the hex/rgba value after the colon. Nothing else.
     ================================================================ */
  :root {

    /* ---- 1. WEBSITE BACKGROUND (gradient, top → bottom) ---- */
    --bg-top:    #202;   /* lighter colour at the TOP of the page */
    --bg-bottom: #202743;   /* your base navy, at the BOTTOM        */

    /* ---- 2. "ParKuma" TITLE ---- */
    --title: #ffffff;       /* colour of the letters */

    /* ---- 3. OUTLINE AROUND EVERY LINK BOX ---- */
    --outline: rgba(255, 255, 255, .75);  /* border on all 7 links */

  }
  /* ================================================================
     END OF COLOUR SETTINGS
     Link button colours (--c and --t) are set per-link in the HTML below.
     ================================================================ */

  * { box-sizing: border-box; }

  /* Gradient sits on <html> so it paints the whole viewport directly —
     no background-attachment:fixed (which janks on iOS) and no white
     flash before load. */
  html {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Title — plain text, no box */
  h1 {
    margin: 0 0 26px;
    text-align: center;
    font-family: "Baloo 2", "Nunito", system-ui, sans-serif;
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: .2px;
    color: var(--title);
  }

  /* Mobile first: single column */
  nav {
    width: 100%;
    max-width: 340px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  /* Each link sets its own --c (background) and --t (text) inline. */
  nav a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 14px 20px;
    text-align: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.2rem;
    line-height: 1.2;
    color: var(--t, #ffffff);
    background: var(--c, #444444);
    border: 2px solid var(--outline);
    border-radius: 999px;
  }

  nav a:focus-visible {
    outline: 3px solid currentColor;
    outline-offset: 3px;
  }

  /* Motion only for users who haven't asked for less */
  @media (prefers-reduced-motion: no-preference) {
    nav a {
      transition: filter .15s ease, transform .15s ease;
    }
    nav a:hover  { filter: brightness(.94); }
    nav a:active { transform: scale(.98); }
  }

  /* Tablet: two columns */
  @media (min-width: 700px) {
    nav {
      max-width: 660px;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    nav a { min-height: 66px; font-size: 1.2rem; }
  }

  /* Laptop / desktop */
  @media (min-width: 1100px) {
    nav { max-width: 820px; gap: 22px; }
    nav a {
      min-height: 78px;
      padding: 18px 26px;
      font-size: 1.35rem;
    }
    h1 { font-size: 3.8rem; margin-bottom: 34px; }
  }

  /* Large desktop */
  @media (min-width: 1800px) {
    nav { max-width: 1040px; gap: 26px; }
    nav a { min-height: 92px; font-size: 1.55rem; }
    h1 { font-size: 4.8rem; }
  }

  /* Short landscape screens */
  @media (max-height: 520px) and (orientation: landscape) {
    body { align-items: flex-start; padding-block: 20px; }
    nav { max-width: 820px; grid-template-columns: 1fr 1fr; gap: 12px; }
    nav a { min-height: 50px; font-size: 1.05rem; }
    h1 { font-size: 1.9rem; margin-bottom: 16px; }
  }

  @media (forced-colors: active) {
    nav a { border: 2px solid LinkText; }
  }
</style>
</head>
<body>
<main>
  <h1>ParKuma</h1>

  <!-- ============================================================
       LINK BUTTONS — EDIT HERE
       ------------------------------------------------------------
       Each link is ONE line:
         --c = button background colour
         --t = button text colour
       The comment above each line names its current colour.

       To ADD:    copy a line, paste it, change URL, text and colours.
       To DELETE: delete the whole line.
       To RECOLOUR: change --c (background) and --t (text) only.
       ============================================================ -->

  <nav aria-label="ParKuma links">
    <!-- ko-fi orange -->
    <a href="https://ko-fi.com/parkuma" target="_blank" rel="noopener" style="--c:#f25c28; --t:#ffffff">Support Me</a>

    <!-- patreon black -->
    <a href="https://www.patreon.com/ParKuma" target="_blank" rel="noopener" style="--c:#262626; --t:#ffffff">Patreon</a>

    <!-- instagram pink -->
    <a href="https://www.instagram.com/parkuma_art" target="_blank" rel="noopener" style="--c:#de23a6; --t:#ffffff">Instagram</a>

    <!-- x dark grey -->
    <a href="https://x.com/parkuma_art" target="_blank" rel="noopener" style="--c:#383838; --t:#ffffff">X (Twitter)</a>

    <!-- bluesky blue -->
    <a href="https://bsky.app/profile/parkuma.bsky.social" target="_blank" rel="noopener" style="--c:#006afe; --t:#ffffff">BlueSky</a>

    <!-- youtube red -->
    <a href="https://www.youtube.com/@ParKuma" target="_blank" rel="noopener" style="--c:#ff3232; --t:#ffffff">YouTube</a>

    <!-- coral red -->
    <a href="mailto:parkumaofficial@gmail.com" style="--c:#fc413c; --t:#ffffff">E-Mail</a>
  </nav>

  <!-- ===================== END OF LINK BUTTONS ===================== -->
</main>
</body>
</html>
